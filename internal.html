<!doctype html>
<html lang="en-US">
  <head>
    <title>Web Chat: DirectLine Integration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@7.8.7/babel.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react@16.8.6/umd/react.development.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@16.8.6/umd/react-dom.development.js"></script>
    <script crossorigin src="./internal/webchat-es5.js"></script>
    <script crossorigin src="./internal/webchat-fluent-theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(to right, #6a11cb, #2575fc);
      }
      
      .page-layout {
        display: grid;
        grid-template-columns: 250px 1fr;
        height: 100%;
        padding: 20px;
        gap: 40px;
      }
      
      @media (max-width: 900px) {
        .page-layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
      }
      
      .controls-panel {
        color: white;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }
      
      .controls-panel h1 {
        font-size: 2rem;
        font-weight: bold;
        margin: 0 0 20px 0;
        line-height: 1.2;
      }
      
      /* Chat Container */
      .chat-area {
        display: flex;
        justify-content: flex-end;
        align-items: stretch;
        min-height: 0;
        padding-right: 20px;
      }
      
      .chat-container {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
        width: min(480px, 100%);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      
      .chat-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid #e0e0e0;
        background: #f9f9f9;
      }
      
      .chat-header-title {
        font-size: 14px;
        font-weight: 600;
        color: #242424;
        flex: 1;
      }
      
      #webchat {
        flex: 1;
        overflow: hidden;
        min-height: 0;
      }
      
      .error-bar {
        display: none;
        background-color: #d32f2f;
        color: white;
        text-align: center;
        padding: 12px 16px;
        font-weight: 500;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
      }
      
      /* Modal Overrides */
      .modal-content {
        border-radius: 12px;
        border: none;
        box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.14);
      }
      .modal-header {
        border-bottom: 1px solid #e0e0e0;
        padding: 16px 20px;
      }
      .modal-body {
        padding: 20px;
      }
      .modal-title {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="page-layout">
      <div class="controls-panel">
        <h1>S2S Demo Website</h1>
        <div class="mb-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="chatMode" id="defaultMode" value="default" onchange="toggleChatMode()" checked>
            <label class="form-check-label" for="defaultMode">
              Default mode
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="chatMode" id="mcsTestPane" value="mcs" onchange="toggleChatMode()">
            <label class="form-check-label" for="mcsTestPane">
              Multi modal mode
            </label>
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-warning" onclick="startOver()">Start Over</button>
        </div>
      </div>
      
      <div class="chat-area">
        <div class="chat-container">
          <div class="chat-header">
            <span class="chat-header-title">Agent</span>
          </div>
          <div id="webchat" role="main"></div>
        </div>
      </div>
    </div>
    
    <div id="errorContainer" class="error-bar">
      <span id="errorMessage"></span>
      <button class="btn btn-light btn-sm ms-2" onclick="retryFetch()">Retry</button>
    </div>
    <div class="modal fade" id="configModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="configModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="configModalLabel">Enter DirectLine Configuration</h5>
            <button type="button" class="btn-close" id="modalCloseButton" disabled></button>
          </div>
          <div class="modal-body">
            <form id="configForm">
              <div class="mb-3">
                <label for="secret" class="form-label">DirectLine Secret <span class="text-danger">*</span></label>
                <input class="form-control" id="secret" required>
                <div class="form-text">Your DirectLine channel secret from Azure Bot Service</div>
              </div>
              <div class="mb-3">
                <label for="botSchema" class="form-label">Bot Schema Name(Optional)</label>
                <input type="text" class="form-control" id="botSchema" placeholder="cr924_copilotWeatherBot">
                <div class="form-text">It will connect to given env and bot</div>
              </div>
              <div class="mb-3">
                <label for="environmentId" class="form-label">Environment ID (Optional)</label>
                <input type="text" class="form-control" id="environmentId" placeholder="defaultc2983f0e34ee4b438abcc2f460fd26b.e.environment.api.preprod.powerplatform.com">
                <div class="form-text">It will connect to given env and bot</div>
              </div>
              <button type="submit" class="btn btn-primary">Connect</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script type="text/babel" data-presets="es2015,react,stage-3">
      let modal = new bootstrap.Modal(document.getElementById('configModal'));
      let currentDirectLine = null;
      let currentWebChatProps = null;

      // Processing audio middleware - plays a .wav file in loop during 'processing' state
      const createProcessingAudioMiddleware = (audioUrl) => {
        let audio = null;
        let isPlaying = false;

        const startLoop = () => {
          if (!audioUrl || isPlaying) return;
          
          if (!audio) {
            audio = new Audio(audioUrl);
            audio.loop = true;
          }
          audio.currentTime = 0;
          audio.play()
            .then(() => { isPlaying = true; })
            .catch(() => {});
        };

        const stopLoop = () => {
          if (!audio || !isPlaying) return;
          
          audio.pause();
          audio.currentTime = 0;
          isPlaying = false;
        };

        return store => next => action => {
          const result = next(action);
          // Watch for voice state changes
          if (action.type === 'WEB_CHAT/VOICE_SET_STATE') {
            const newVoiceState = action.payload.voiceState;
            
            if (newVoiceState === 'processing') {
              startLoop();
            } else {
              stopLoop();
            }
          }

          // Also stop when recording stops
          if (action.type === 'WEB_CHAT/VOICE_STOP_RECORDING') {
            stopLoop();
          }

          return result;
        };
      };

      // Processing audio URL - relative to index.html location
      const processingAudioUrl = './asset/Percolation.wav';

      async function renderWebChat() {
        // Always clear the existing webchat before re-rendering
        const webChatContainer = document.getElementById('webchat');
        if (webChatContainer.firstChild) {
          window.ReactDOM.unmountComponentAtNode(webChatContainer);
        }

        let secret = localStorage.getItem('directline_secret');
        let botSchema = localStorage.getItem('bot_schema');
        let environmentId = localStorage.getItem('environment_id');
        
        try {
          // Only create new DirectLine if we don't have one yet
          if (!currentDirectLine) {
            if (secret) {
              // Step 1: Generate DirectLine token
              const res = await fetch(
                `https://directline.scratch.botframework.com/v3/directline/tokens/generate`,
                { 
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${secret}`
                  }
                }
              );
              
              if (!res.ok) {
                throw new Error(`Failed to generate token: ${res.status} ${res.statusText}`);
              }
              
              const { token } = await res.json();
              
              // Step 2: Create DirectLine conversation
              const conRes = await fetch(
                `https://directline.scratch.botframework.com/v3/directline/conversations`,
                { 
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${token}`
                  }
                }
              );
              
              if (!conRes.ok) {
                throw new Error(`Failed to create conversation: ${conRes.status} ${conRes.statusText}`);
              }
              
              const { conversationId, streamUrl: originalStreamUrl } = await conRes.json();

              // const reverseProxy = "wss://custom-reverse-proxy-voice-live-seasia-g6hhfwfxh6e8fadd.southeastasia-01.azurewebsites.net/voice-live/realtime?api-version=2025-05-01-preview&model=gpt-4.1";
              let streamUrl = originalStreamUrl;
              
              const isMCSTestPane = localStorage.getItem('mcs_test_pane') === 'true';
              const ppFqdn = environmentId;
              const botSchemaName = botSchema;
              
              // Add optional parameters only if provided
              if (ppFqdn) streamUrl += `&ppFqdn=${ppFqdn}`;
              if (botSchemaName) streamUrl += `&botSchemaName=${botSchemaName}`;
              
              if (isMCSTestPane) {
                streamUrl = `${streamUrl}&mode=voice`;
              }
              
              // Step 3: Create DirectLine instance for WebChat
              const domain = "https://directline.scratch.botframework.com/v3/directline";
              currentDirectLine = window.WebChat.createDirectLine({ 
                streamUrl, 
                token, 
                domain, 
                conversationId 
              });
            } else {
              // If credentials are not available for the selected mode, do nothing.
              return;
            }
          }
          
          const { ReactWebChat, FluentThemeProvider } = window.WebChat;
          
          const isMCSTestPane = localStorage.getItem('mcs_test_pane') === 'true';
          
          const styleOptions = {
            ...(isMCSTestPane && {
              disableFileUpload: true,
              hideTelephoneKeypadButton: true,
            }),
          };
          
          // Create store with processing audio middleware
          const store = window.WebChat.createStore(
            {},
            ({ dispatch }) => next => action => next(action),
            createProcessingAudioMiddleware(processingAudioUrl)
          );
          
          currentWebChatProps = {
            directLine: currentDirectLine,
            styleOptions: styleOptions,
            store: store,
          };

          const webChatElement = isMCSTestPane ? (
            <div style={{backgroundColor: 'white', height: '100%', width: '100%'}}>
              <FluentThemeProvider variant="fluent">
                <ReactWebChat {...currentWebChatProps} />
              </FluentThemeProvider>
            </div>
          ) : (
            <div style={{backgroundColor: 'white', height: '100%', width: '100%'}}>
              <ReactWebChat {...currentWebChatProps} />
            </div>
          );

          window.ReactDOM.render(
            webChatElement,
            document.getElementById('webchat')
          );
          
          // Small delay to ensure proper initialization when MCS test pane is enabled
          if (isMCSTestPane) {
            setTimeout(() => {
              const webChatElement = document.querySelector('#webchat > *');
              if (webChatElement) {
                webChatElement.focus();
              }
            }, 100);
          } else {
            document.querySelector('#webchat > *').focus();
          }
          
        } catch (error) {
          localStorage.removeItem('directline_secret');
          localStorage.removeItem('bot_schema');
          localStorage.removeItem('environment_id');
          const errContainer = document.getElementById('errorContainer');
          const errorMessage = document.getElementById('errorMessage');
          errorMessage.innerText = `Connection failed: ${error.message}. Please check your DirectLine secret and try again.`;
          errContainer.style.display = 'block';
        }
      }

      function toggleChatMode() {
        const selectedMode = document.querySelector('input[name="chatMode"]:checked').value;
        
        // Clear previous settings
        localStorage.removeItem('mcs_test_pane');
        
        // Set new mode
        if (selectedMode === 'mcs') {
          localStorage.setItem('mcs_test_pane', 'true');
        }
        // Default mode doesn't need any localStorage values
        
        // Reset DirectLine connection to ensure proper reinitialization
        currentDirectLine = null;
        
        renderWebChat();
      }

      (async function () {
        let secret = localStorage.getItem('directline_secret');
        let botSchema = localStorage.getItem('bot_schema');
        let environmentId = localStorage.getItem('environment_id');

        // Initialize radio button states
        const mcsTestPane = localStorage.getItem('mcs_test_pane') === 'true';
        
        if (mcsTestPane) {
          document.getElementById('mcsTestPane').checked = true;
        } else {
          document.getElementById('defaultMode').checked = true;
        }

        if (!secret) {
          document.getElementById('secret').value = secret || '';
          document.getElementById('botSchema').value = botSchema || "cr924_copilotWeatherBot";
          document.getElementById('environmentId').value = environmentId || "defaultc2983f0e34ee4b438abcc2f460fd26b.e.environment.api.preprod.powerplatform.com";
          
          modal.show();
          
          function validateForm() {
            const secretValue = document.getElementById('secret').value.trim();
            let isValid = secretValue.length > 0;
            document.getElementById('modalCloseButton').disabled = !isValid;
          }

          document.getElementById('secret').addEventListener('input', validateForm);
          
          document.getElementById('configForm').addEventListener('submit', function (event) {
            event.preventDefault();
            secret = document.getElementById('secret').value;
            botSchema = document.getElementById('botSchema').value;
            environmentId = document.getElementById('environmentId').value;

            localStorage.setItem('directline_secret', secret);
            if (botSchema) localStorage.setItem('bot_schema', botSchema);
            if (environmentId) localStorage.setItem('environment_id', environmentId);
            
            modal.hide();
            renderWebChat();
          });
          return;
        }

        renderWebChat();
      })();

      function retryFetch() {
        const errContainer = document.getElementById('errorContainer');
        const errorMessage = document.getElementById('errorMessage');
        errorMessage.innerText = '';
        errContainer.style.display = 'none';
        modal.show();
      }

      function startOver() {
        // Preserve chat mode selection
        const selectedMode = document.querySelector('input[name="chatMode"]:checked').value;

        // Clear connection-related localStorage data
        localStorage.removeItem('directline_secret');
        localStorage.removeItem('bot_schema');
        localStorage.removeItem('environment_id');
        
        // Refresh the page
        window.location.reload();
      }
    </script>
  </body>
</html>
